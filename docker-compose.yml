# Local infrastructure for the XNFT backend.
# Phase 1 (now): Postgres for auth.
# Phase 2 (later): uncomment Kafka + Zookeeper for the event-driven backbone
#                  (email service, notifications, analytics consumers).

services:
  postgres:
    image: postgres:16-alpine
    container_name: xnft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xnft
      POSTGRES_PASSWORD: xnft
      POSTGRES_DB: xnft
    ports:
      - "5432:5432"
    volumes:
      - xnft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnft"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Phase 2: event bus (uncomment when wiring Kafka) ─────────────────────
  # kafka:
  #   image: bitnami/kafka:3.7
  #   container_name: xnft-kafka
  #   restart: unless-stopped
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_CFG_NODE_ID: 0
  #     KAFKA_CFG_PROCESS_ROLES: controller,broker
  #     KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  #     KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
  #     KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

volumes:
  xnft-postgres-data:
